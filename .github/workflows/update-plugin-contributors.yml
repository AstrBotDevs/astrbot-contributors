name: Update plugin contributors

on:
  schedule:
    - cron: "42 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip aiohttp tqdm

      - name: Update plugin contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" > .github_token
          python fetch_plugin_contributors.py --concurrency 20 --retries 2
          rm -f .github_token

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins-contributors.json
            git commit -m "chore: update plugin contributors"
            git push
          else
            echo "No changes to commit."
          fi
